name: huawei-train
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.11
  - pytorch
  - torchvision
  - pytorch-cuda=11.8
  - numpy
  - scipy
  - scikit-image
  - pillow
  - matplotlib
  - tqdm
  - pyyaml
  - pip

  - pip:
      - basicsr
      - opencv-python
      - lmdb
      - einops
      - lightning
      - torchmetrics
      - hydra-core
      - wandb
      - tensorboardq
