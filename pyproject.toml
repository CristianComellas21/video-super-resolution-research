[project]
name = "super-resolution"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy==1.26.4",
    "scipy",
    "scikit-image",
    "pillow",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "opencv-python",
    "lmdb",
    "einops",
    "lightning",
    "torchmetrics",
    "hydra-core",
    "wandb",
    "tensorboard",
    "basicsr==1.4.2",
]

[dependency-groups]
jlserver = [
    "torch==2.6.0",
    "torchvision==0.21.0",
]

talaia = [
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[tool.uv]
package = false
default-groups = ["jlserver"]

conflicts = [
    [
        { group = "jlserver" },
        { group = "talaia" },
    ],
]

[tool.uv.sources]
basicsr = { git = "https://github.com/XPixelGroup/BasicSR.git", rev = "8d56e3a045f9fb3e1d8872f92ee4a4f07f886b0a" }

torch = [
    { index = "pytorch-cu124", group = "jlserver" },
    { index = "pytorch-cu128", group = "talaia" },
]

torchvision = [
    { index = "pytorch-cu124", group = "jlserver" },
    { index = "pytorch-cu128", group = "talaia" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true