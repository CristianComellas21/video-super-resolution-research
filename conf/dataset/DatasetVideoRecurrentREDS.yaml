_target_: datasets.DatasetVideoRecurrent.Dataset

dataname: REDS
seq_len: 3
stride: 1
scale: 4
meta_info_file: null
max_depth: 2
max_samples: null
spatial_crop_size: 64


train:
  dataroot_gt: ${path.data_dir}/${..dataname}/train/train_sharp
  dataroot_lq: ${path.data_dir}/${..dataname}/train/train_sharp_bicubic
  spatial_crop_mode: random
  use_hflip: true
  use_vflip: true
  use_rot: true
  random_reverse: false


val:
  dataroot_gt: ${path.data_dir}/${..dataname}/val/val_sharp
  dataroot_lq: ${path.data_dir}/${..dataname}/val/val_sharp_bicubic
  spatial_crop_mode: center
  use_hflip: false
  use_vflip: false
  use_rot: false
  random_reverse: false
  max_samples: 100

test: {}
