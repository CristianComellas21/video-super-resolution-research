# @package _global_

defaults:
  - override /scheduler: StepLR
  - override /dataloader: RandomSamplerDataloader
  - override /model: FlexibleVideoSR

model:

  feat_ch: 128
  num_feat_blocks: 5

  fusions: 
  - _target_: modules.fusion.FlowGuidedDeformableConcatFusion
    feat_ch: 128
    num_blocks: 4
    kernel_size: 3
    use_residual_offsets: true
    offset_hidden_ch: 64
    use_final_residual: true

trainer:
  check_val_every_n_epoch: 10