# @package _global_

defaults:
  - override /scheduler: CosineAnnealingLRSteps
  - override /dataloader: BasicDataloader
  - override /model: FlexibleRecurrentVideoSR
  - override /litmodule: LitStepBased
  - override /trainer: MixedPrecisionTrainer
  - override /optimizer: AdamW

model:

  feat_ch: 128
  num_feat_blocks: 5

  fusions: 
  - _target_: modules.fusion.FlowGuidedDeformableConcatFusion
    feat_ch: ${model.feat_ch}
    num_blocks: 4
    kernel_size: 3
    use_residual_offsets: true
    offset_hidden_ch: 64
    use_final_residual: true

  reconstruction_fusion:
    _target_: modules.fusion.FlowGuidedDeformableConcatFusion
    feat_ch: ${model.feat_ch}
    num_blocks: 2
    kernel_size: 3
    use_residual_offsets: true
    offset_hidden_ch: 64
    use_final_residual: true

ema:
  enabled: true
  decay: 0.999
  start_step: 10000
  save_last_ema: true
  ema_ckpt_name: last_ema.ckpt
  use_buffers: true

  save_on_validation: true
  latest_ema_ckpt_name: latest_ema.ckpt

trainer:
  max_steps: 300000
  val_check_interval: 5000
  check_val_every_n_epoch: null

dataloader:
  train:
    drop_last: true

dataset:
  val:
    max_samples: 1000